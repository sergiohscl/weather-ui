name: Deploy Weather UI

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-push:
    name: 🐳 Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Check Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "❌ DOCKER_USERNAME está vazio ou não existe"
            exit 1
          fi

          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "❌ DOCKER_PASSWORD está vazio ou não existe"
            exit 1
          fi

          echo "✅ Docker Hub secrets configurados"

      - name: 🐳 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Build Docker image
        run: |
          docker build \
            -t sergiohscl/weather-ui:latest \
            -t sergiohscl/weather-ui:${{ github.sha }} \
            .

      - name: 🚀 Push Docker image
        run: |
          docker push sergiohscl/weather-ui:latest
          docker push sergiohscl/weather-ui:${{ github.sha }}

  deploy:
    name: 🚀 Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: 🔐 Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' '${{ secrets.ORACLE_SSH_KEY }}' > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

          ssh-keygen -y -f ~/.ssh/oracle_key > ~/.ssh/oracle_key.pub

          echo "🔑 Fingerprint da chave recebida pelo GitHub:"
          ssh-keygen -lf ~/.ssh/oracle_key.pub

          echo "🌐 Host: ${{ secrets.ORACLE_HOST }}"
          echo "👤 User: ${{ secrets.ORACLE_USERNAME }}"

          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

          echo "✅ SSH configurado"

      - name: 🚀 Deploy Weather UI
        run: |
          ssh \
            -i ~/.ssh/oracle_key \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.ORACLE_USERNAME }}@${{ secrets.ORACLE_HOST }}" << 'EOF'

            set -e

            cd ~/weather-ui

            echo "📥 Baixando nova imagem..."
            docker compose pull

            echo "🔄 Atualizando container..."
            docker compose up -d

            echo "🧹 Removendo imagens antigas..."
            docker image prune -f

            echo "📊 Status do container:"
            docker compose ps

            echo "✅ Deploy concluído!"

          EOF