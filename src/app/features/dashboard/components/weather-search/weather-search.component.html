<section class="mb-10">

  <form
    (ngSubmit)="onSubmit()"
    class="flex w-full max-w-2xl flex-col gap-2 rounded-2xl border border-white/10 bg-white/5 p-2 shadow-2xl backdrop-blur sm:flex-row sm:items-center sm:gap-0"
  >

    <div class="flex min-w-0 flex-1 items-center">

      <span class="px-3 text-xl sm:px-4">
        🔎
      </span>

      <input
        type="text"
        name="city"
        [ngModel]="city"
        (ngModelChange)="onCityChange($event)"
        placeholder="Digite uma cidade..."
        autocomplete="off"
        class="min-w-0 flex-1 bg-transparent px-2 py-3 text-white outline-none placeholder:text-slate-500"
      />

    </div>

    <button
      type="submit"
      [disabled]="loading || !city.trim()"
      class="w-full shrink-0 rounded-xl bg-sky-500 px-6 py-3 font-semibold text-white transition hover:bg-sky-400 disabled:cursor-not-allowed disabled:opacity-50 sm:w-auto"
    >

      @if (!loading) {
        <span>Buscar</span>
      }

      @if (loading) {
        <span class="flex items-center justify-center gap-2">

          <span
            class="h-4 w-4 animate-spin rounded-full border-2 border-white/30 border-t-white"
          ></span>

          Buscando...

        </span>
      }

    </button>

  </form>

  @if (error) {
    <div
      class="mt-3 w-full max-w-2xl rounded-xl border border-red-500/20 bg-red-500/10 px-4 py-3 text-sm text-red-300"
    >
      {{ error }}
    </div>
  }

</section>
