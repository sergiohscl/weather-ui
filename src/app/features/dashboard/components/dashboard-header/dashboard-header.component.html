<header class="border-b border-white/10 bg-slate-950/80 backdrop-blur">
  <div
    class="mx-auto flex max-w-7xl items-center justify-between px-4 py-5 sm:px-6"
  >

    <!-- Logo -->
    <div class="flex items-center gap-3">

      <div
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br from-sky-400 to-blue-600 text-2xl shadow-lg"
      >
        ☁️
      </div>

      <div>
        <h1 class="text-xl font-bold tracking-tight">
          Weather
        </h1>

        <p class="text-xs text-slate-400">
          Weather intelligence
        </p>
      </div>

    </div>

    <!-- Navigation -->
    <div class="flex items-center gap-2">

      @if (weatherId !== null) {
        <button
          type="button"
          (click)="goToAnalysis()"
          class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-sm font-medium text-slate-300 transition hover:bg-white/10 hover:text-white"
        >
          <span>📊</span>

          <span class="hidden sm:inline">
            Análise
          </span>
        </button>
      }

      <button
        type="button"
        class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-sm text-slate-300 transition hover:bg-white/10"
      >
        🌙
      </button>

    </div>

  </div>
</header>
